:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 9px;line-height:1.2}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--panel-2);border-color:transparent}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
button.icon{width:30px;height:30px;padding:0;display:inline-grid;place-items:center}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{width:100%;font-family:var(--mono);font-size:12px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f>span{text-transform:uppercase;letter-spacing:.06em;font-family:var(--disp);font-size:10.5px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
h1,h2,h3{margin:0;font-family:var(--disp);text-wrap:balance}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h3{font-size:15px;font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
#root{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);min-height:50px}
.top .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.top .brand h1{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.top .brand input{font-family:var(--disp);font-weight:600;font-size:14px;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;min-width:0;width:min(34vw,260px)}
.top .brand input:hover,.top .brand input:focus{border-color:var(--line);background:var(--panel-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.top .sp{flex:1}
.top .tools{display:contents}
.top .narrow-only{display:none}
/* main */
.main{display:grid;grid-template-columns:286px 1fr 304px;min-height:0;position:relative}
.side,.insp{background:var(--panel);overflow:auto;display:flex;flex-direction:column;min-height:0}
.side{border-right:1px solid var(--line)}
.insp{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;border:0;border-radius:0;padding:9px 6px;font-family:var(--disp);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:12px;display:none;flex-direction:column;gap:12px}
.pane.on{display:flex}
.search{width:100%}
.cat{display:flex;flex-direction:column;gap:6px}
.cat h2{padding-top:4px}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lib button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 8px;text-align:left;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.lib button:hover{background:var(--panel-2)}
.lib .nm{font-weight:500;font-size:12.5px;line-height:1.2}
.lib .dm{font-family:var(--mono);font-size:11px;color:var(--muted)}
.lib .sw{width:100%;height:4px;border-radius:2px;margin-top:3px}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border-color:transparent;padding:6px 8px}
.list button:hover{background:var(--panel-2)}
.list button.sel{background:var(--accent-soft)}
.list button.bad .nm::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:middle}
.list .dm{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.issues{display:flex;flex-direction:column;gap:4px}
.issue{font-size:12px;padding:6px 8px;border-radius:6px;background:var(--warn-soft);border-left:3px solid var(--warn);cursor:pointer}
.okbox{font-size:12px;padding:6px 8px;border-radius:6px;background:var(--panel-2);border-left:3px solid var(--ok)}
.sw-row{display:flex;gap:5px;flex-wrap:wrap}

.kv b{font-weight:500;color:var(--muted)}
.kv span{font-family:var(--mono)}
.hint{font-size:12px;color:var(--muted)}

.divider{height:1px;background:var(--line-2);margin:2px 0}

.board{position:relative;overflow:hidden;background:var(--canvas)}

.board.grabbing svg{cursor:grabbing}
.board .hud{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;pointer-events:none}
.board .hud>*{pointer-events:auto}
.board .hud .chip:empty{display:none}
.board .hud .chip{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--muted)}
.board .modechip{position:absolute;top:10px;left:10px;font-family:var(--disp);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--muted);pointer-events:none}
.board .modechip.plan{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
svg text{font-family:var(--sans);fill:var(--ink);pointer-events:none;user-select:none}
svg .roomname{font-family:var(--disp);font-weight:600;letter-spacing:.02em}
svg .dims{font-family:var(--mono);fill:var(--muted)}
svg .wall{fill:var(--wall)}
svg .room{stroke:none}
svg .item .body{stroke:rgba(20,24,32,.55);stroke-width:1.2;vector-effect:non-scaling-stroke}
svg .item.sel .body{stroke:var(--accent);stroke-width:2}
svg .item.bad .body{stroke:var(--warn);stroke-width:2}
svg .item .deco{fill:none;stroke:rgba(20,24,32,.45);vector-effect:non-scaling-stroke;stroke-width:1.2}
svg .item.locked .body{stroke-dasharray:4 3}
svg .item.zone .body{stroke:var(--muted);stroke-dasharray:5 4}
svg .item.zone.sel .body{stroke:var(--accent)}
svg .leaf{stroke:var(--wall);stroke-width:2;vector-effect:non-scaling-stroke}
svg .swing{fill:none;stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
svg .gap{fill:var(--floor)}
svg .win{stroke:var(--wall);stroke-width:1.5;vector-effect:non-scaling-stroke}
svg .hit{fill:transparent}
svg .opening.sel .hit{fill:var(--accent);fill-opacity:.25}
svg .handle{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
svg .handle.rot{cursor:grab}
svg .guide{stroke:var(--accent);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:5 4}
svg .guide-t{font-family:var(--mono);fill:var(--accent);font-weight:500}
svg .selbox{fill:none;stroke:var(--accent);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 3}
svg .roomsel{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
svg .measure{stroke:var(--warn);stroke-width:1.5;vector-effect:non-scaling-stroke}
svg .measure-t{font-family:var(--mono);fill:var(--warn);font-weight:600}
svg .calib{fill:var(--warn)}
svg .plan-dim .item{opacity:.45}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

.scrim{position:fixed;inset:0;background:rgba(10,14,20,.35);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.scrim.on{display:flex}

.dlg section h2{font-size:11px}
.banner{background:var(--accent-soft);border-bottom:1px solid var(--line);padding:6px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- units ---------- */
const isFt=()=>state.units==='ft';
function fmt(cm,short){ if(isFt()){ const inch=cm/2.54; const ft=Math.floor(inch/12); const i=Math.round(inch-ft*12); if(i===12) return (ft+1)+"′0″"; return ft+'′'+i+'″'; } const m=cm/100; return (short&&cm<100? Math.round(cm)+' cm' : m.toFixed(2)+' m'); }
function fmtArea(cm2){ if(isFt()) return (cm2/929.03).toFixed(0)+' sq ft'; return (cm2/10000).toFixed(1)+' m²'; }
const unitLabel=()=>isFt()?'in':'cm';
const toUnit=cm=>isFt()? Math.round(cm/2.54*10)/10 : Math.round(cm*10)/10;
const fromUnit=v=>isFt()? v*2.54 : v;

/* ---------- geometry ---------- */
function rot(px,py,deg){const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return [px*c-py*s,px*s+py*c];}
function localPolys(it){const w=it.w,d=it.d;
 if(it.shape==='round'){const n=20,p=[];for(let i=0;i<n;i++){const a=i/n*2*Math.PI;p.push([w/2*Math.cos(a),d/2*Math.sin(a)]);}return [p];}
 if(it.shape==='L'){const a=clamp(it.a||d*.6,10,d),b=clamp(it.b||w*.4,10,w);return [[[-w/2,-d/2],[w/2,-d/2],[w/2,-d/2+a],[-w/2,-d/2+a]],[[-w/2,-d/2+a],[-w/2+b,-d/2+a],[-w/2+b,d/2],[-w/2,d/2]]];}
 return [[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]]];}
function outlineLocal(it){const w=it.w,d=it.d; if(it.shape==='L'){const a=clamp(it.a||d*.6,10,d),b=clamp(it.b||w*.4,10,w);return [[-w/2,-d/2],[w/2,-d/2],[w/2,-d/2+a],[-w/2+b,-d/2+a],[-w/2+b,d/2],[-w/2,d/2]];} return localPolys(it)[0];}
function toWorldPoly(it,poly){const m=it.mirror?-1:1;return poly.map(([px,py])=>{const [rx,ry]=rot(px*m,py,it.rot);return [it.x+rx,it.y+ry];});}
function worldPolys(it){return localPolys(it).map(p=>toWorldPoly(it,p));}
function aabbOf(polys){let a={minX:Infinity,minY:Infinity,maxX:-Infinity,maxY:-Infinity};polys.forEach(p=>p.forEach(([x,y])=>{a.minX=Math.min(a.minX,x);a.maxX=Math.max(a.maxX,x);a.minY=Math.min(a.minY,y);a.maxY=Math.max(a.maxY,y);}));return a;}
function sat(A,B){const eps=0.5;for(const P of [A,B]){for(let i=0;i<P.length;i++){const [x1,y1]=P[i],[x2,y2]=P[(i+1)%P.length];const nx=y2-y1,ny=-(x2-x1);const L=Math.hypot(nx,ny)||1;let a0=Infinity,a1=-Infinity,b0=Infinity,b1=-Infinity;for(const [x,y] of A){const p=(x*nx+y*ny)/L;if(p<a0)a0=p;if(p>a1)a1=p;}for(const [x,y] of B){const p=(x*nx+y*ny)/L;if(p<b0)b0=p;if(p>b1)b1=p;}if(a1<=b0+eps||b1<=a0+eps)return false;}}return true;}
function polysHit(P,Q){for(const a of P)for(const b of Q)if(sat(a,b))return true;return false;}
function ptInRoom(x,y,r){return x>=r.x-0.5&&x<=r.x+r.w+0.5&&y>=r.y-0.5&&y<=r.y+r.d+0.5;}
function roomAt(x,y){return state.rooms.find(r=>ptInRoom(x,y,r))||null;}
function doorSwingPoly(o){const s=o.flip?-1:1,pts=[[0,0]];for(let i=0;i<=8;i++){const a=i/8*Math.PI/2;pts.push([o.w*Math.cos(a),s*o.w*Math.sin(a)]);}return pts.map(([px,py])=>{const [rx,ry]=rot(px,py,o.rot);return [o.x+rx,o.y+ry];});}
function openingEnd(o){const [rx,ry]=rot(o.w,0,o.rot);return [o.x+rx,o.y+ry];}
function textColorFor(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return 'var(--ink)';const n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;const L=(0.2126*r+0.7152*g+0.0722*b)/255;return L>0.6?'#1B1F26':'#F6F7F4';}
function norm(a){a=a%360;if(a<0)a+=360;return Math.round(a*100)/100;}

/* ---------- issues ---------- */
function computeIssues(){issues={};issueList=[];const add=(id,msg)=>{(issues[id]=issues[id]||[]).push(msg);issueList.push({id,msg});};
 const its=state.items.map(it=>({it,polys:worldPolys(it)}));
 for(let i=0;i<its.length;i++){const A=its[i];const it=A.it;
  if(!it.under&&!it.zone){const r=roomAt(it.x,it.y);
   if(!r)add(it.id,it.name+' is outside every room');
   else{const ab=aabbOf(A.polys);if(ab.minX<r.x-1||ab.maxX>r.x+r.w+1||ab.minY<r.y-1||ab.maxY>r.y+r.d+1)add(it.id,it.name+' crosses a wall of '+r.name);}
   for(const o of state.openings){if(o.kind!=='door')continue;if(polysHit(A.polys,[doorSwingPoly(o)]))add(it.id,it.name+' blocks a door swing');}
  }
  for(let j=i+1;j<its.length;j++){const B=its[j];if(A.it.under||B.it.under)continue;if(A.it.zone&&B.it.zone)continue;
   if(A.it.zone||B.it.zone){const z=A.it.zone?A:B,f=A.it.zone?B:A;if(f.it.locked)continue;if(polysHit(A.polys,B.polys))add(f.it.id,f.it.name+' sits in a "'+z.it.name+'" area');continue;}
   if(polysHit(A.polys,B.polys)){add(A.it.id,A.it.name+' overlaps '+B.it.name);add(B.it.id,B.it.name+' overlaps '+A.it.name);}}
 }}

/* ---------- history / persistence ---------- */
function pushHistory(){hist.push(JSON.stringify(state));if(hist.length>120)hist.shift();future=[];}
function undo(){if(!hist.length)return;future.push(JSON.stringify(state));state=JSON.parse(hist.pop());sel=null;changed();}
function redo(){if(!future.length)return;hist.push(JSON.stringify(state));state=JSON.parse(future.pop());sel=null;changed();}
function changed(opts){computeIssues();render();if(!(opts&&opts.noPanels))renderPanels();scheduleSave();}
function embeddedState(){try{return JSON.parse($('#state').textContent||'null');}catch(e){return null;}}
function baseKey(){const e=embeddedState();return e?(e.savedAt||'embedded'):'plan:'+PLAN_ID;}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({base:baseKey(),t:Date.now(),state}));}catch(e){}},400);}
function b64url(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64url(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function encodeState(s){const json=JSON.stringify(s);let bytes=new TextEncoder().encode(json),p='j';if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw');const w=cs.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer());p='d';}catch(e){}}return p+b64url(bytes);}
async function decodeState(str){str=str.trim();const p=str[0];let bytes=unb64url(str.slice(1));if(p==='d'){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer());}else if(p!=='j')throw new Error('bad code');return JSON.parse(new TextDecoder().decode(bytes));}
function validState(s){return s&&Array.isArray(s.rooms)&&Array.isArray(s.items)&&Array.isArray(s.openings);}
async function loadInitial(){
 const m=/[#&]s=([^&]+)/.exec(location.hash||'');
 if(m){try{const s=await decodeState(decodeURIComponent(m[1]));if(validState(s)){fromLink=true;return s;}}catch(e){console.warn('link state unreadable',e);}}
 const emb=embeddedState();const base=emb?(emb.savedAt||'embedded'):'plan:'+PLAN_ID;
 try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&validState(d.state)){if(d.base===base)return d.state;planUpdated=true;localStorage.removeItem(KEY);}}catch(e){}
 return validState(emb)?emb:clone(SAMPLE);}

/* ---------- walls ---------- */
function sharedWallSegments(){const segs=[];const rs=state.rooms;const key=r=>r.name.trim().toLowerCase();

  if(Math.abs(a.x+a.w-b.x)<0.6||Math.abs(b.x+b.w-a.x)<0.6){const x=Math.abs(a.x+a.w-b.x)<0.6?a.x+a.w:b.x+b.w;const y0=Math.max(a.y,b.y),y1=Math.min(a.y+a.d,b.y+b.d);if(y1-y0>1)segs.push({x1:x,y1:y0,x2:x,y2:y1});}

function snapItemPos(it,nx,ny){const th=8/view.k;const tmp=Object.assign({},it,{x:nx,y:ny});const ab=aabbOf(worldPolys(tmp));

function deleteSel(){if(!sel)return;pushHistory();if(sel.kind==='item')state.items=state.items.filter(i=>i.id!==sel.id);else if(sel.kind==='room')state.rooms=state.rooms.filter(i=>i.id!==sel.id);else if(sel.kind==='opening')state.openings=state.openings.filter(i=>i.id!==sel.id);else if(sel.kind==='underlay')state.underlay=null;sel=null;changed();}

  $('#f-w').addEventListener('change',e=>commit(()=>{o.w=clamp(fromUnit(+e.target.value)||20,20,600);}));$('#f-rot').addEventListener('change',e=>commit(()=>{o.rot=norm(+e.target.value||0);}));
  const bs=$('#b-swing'),bh=$('#b-hinge');if(bs)bs.addEventListener('click',()=>commit(()=>{o.flip=!o.flip;}));if(bh)bh.addEventListener('click',()=>commit(()=>flipHinge(o)));
  $('#b-dup').addEventListener('click',duplicateSel);$('#b-del').addEventListener('click',deleteSel);return;}
 if(sel.kind==='underlay'){const u=s;h+='<div class="pane on"><h3>Floor plan image</h3><div class="hint">Drag the image to move it. Use “Calibrate scale” in the Plan tab so 1 m on the image equals 1 m on the board.</div><label class="f"><span>Opacity</span><input type="range" id="u-op2" min="0.1" max="1" step="0.05" value="'+u.opacity+'"></label><div class="row"><button id="u-cal2">Calibrate scale</button><button id="u-lock2">'+(u.locked?'Unlock':'Lock')+'</button></div></div>';p.innerHTML=h;
  $('#u-op2').addEventListener('input',e=>{u.opacity=+e.target.value;render();scheduleSave();});$('#u-cal2').addEventListener('click',startCalib);$('#u-lock2').addEventListener('click',()=>{u.locked=!u.locked;changed();});return;}}
function liveInspector(){const s=getSel();if(!s)return;const pos=$('#f-pos');if(pos&&sel.kind==='item')pos.textContent=fmt(s.x)+', '+fmt(s.y);const fr=$('#f-rot');if(fr&&document.activeElement!==fr)fr.value=s.rot;
 if(sel.kind==='item'){const fw=$('#f-w'),fd=$('#f-d');if(fw&&document.activeElement!==fw)fw.value=toUnit(s.w);if(fd&&document.activeElement!==fd)fd.value=toUnit(s.d);}
 if(sel.kind==='room'){['w','d','x','y'].forEach(k=>{const el=$('#f-'+k);if(el&&document.activeElement!==el)el.value=toUnit(s[k]);});}}

/* ---------- share dialog ---------- */
function openDlg(html){$('#dlg').innerHTML=html;$('#scrim').classList.add('on');}
function closeDlg(){$('#scrim').classList.remove('on');}
async function openShare(){const canSave=!!caps.artifact&&!readOnly;const code=await encodeState(stripForShare(state));
 let h='<div class="row" style="justify-content:space-between"><h3>Share this board</h3><button class="ghost" id="dlg-x" aria-label="Close">✕</button></div>';
 h+='<section><h2>Save into this page</h2>'+(canSave?'<div class="hint">Writes the current layout into this page, so anyone who opens the link sees it. '+(state.savedAt?'Last saved '+esc(new Date(state.savedAt).toLocaleString())+'.':'Not saved into the page yet.')+'</div><button class="primary" id="save-page">Save to page</button>':
   (caps.artifact?'<div class="hint">This view is read-only: you can arrange things here, but only the owner (or an editor) can save into the page. Send them a board code instead.</div>':'<div class="hint">Saving into the page is not available in this view. Use a board code or link below.</div>'))+'</section>';
 h+='<section><h2>Link with the layout baked in</h2><div class="hint">Best-effort: some viewers drop the part after <span class="mono">#</span>. If it opens blank, use the code.</div><div class="row"><button id="copy-link">Copy link</button><span class="hint" id="link-note"></span></div></section>';
 h+='<section><h2>Board code</h2><div class="hint">Paste this into the box on any copy of this page to load the layout. '+(state.underlay&&state.underlay.src?'The floor-plan image is left out of codes and links to keep them short; save to page to keep it.':'')+'</div><textarea id="code" rows="3" readonly>'+esc(code)+'</textarea><div class="row"><button id="copy-code">Copy code</button><span class="hint mono">'+code.length+' chars</span></div></section>';
 h+='<section><h2>Load a board code</h2><textarea id="code-in" rows="2" placeholder="Paste a board code here"></textarea><div class="row"><button id="load-code">Load</button></div></section>';
 if(caps.downloads)h+='<section><h2>Download</h2><div class="row"><button id="dl-json">Board file (.json)</button><button id="dl-png">Picture (.png)</button></div></section>';
 h+='<section><h2>Start over</h2><div class="row"><button id="reset-sample">Reset to the traced plan (fittings only)</button><button id="reset-saved"'+(embeddedState()?'':' disabled')+'>Back to last saved version</button></div></section>';
 openDlg(h);
 $('#dlg-x').addEventListener('click',closeDlg);
 const sp=$('#save-page');if(sp)sp.addEventListener('click',saveToPage);
 $('#copy-link').addEventListener('click',async()=>{const base=shareBase();const url=base.split('#')[0]+'#s='+code;const ok=await copyText(url);$('#link-note').textContent=ok?'Copied':'Could not copy — select the code instead';});
 $('#copy-code').addEventListener('click',async()=>{const ok=await copyText(code);toast(ok?'Code copied':'Copy failed — select it and copy by hand');});
 $('#load-code').addEventListener('click',async()=>{try{const s=await decodeState($('#code-in').value);if(!validState(s))throw 0;pushHistory();const u=state.underlay;state=s;if(!state.underlay&&u)state.underlay=u;sel=null;changed();closeDlg();fitView();toast('Board loaded');}catch(e){toast('That code could not be read');}});
 const dj=$('#dl-json');if(dj)dj.addEventListener('click',async()=>{try{await caps.downloads.save({filename:(state.title||'board').replace(/[^\w\- ]+/g,'').trim()+'.json',data:JSON.stringify(state,null,1)});toast('Saved');}catch(e){if(e&&e.code!=='declined')toast('Download not available here');}});
 const dp=$('#dl-png');if(dp)dp.addEventListener('click',exportPNG);
 $('#reset-sample').addEventListener('click',()=>{if(!confirm('Replace everything with the original traced plan? Your furniture will be removed.'))return;pushHistory();state=clone(SAMPLE);sel=null;changed();closeDlg();fitView();});
 const rs=$('#reset-saved');if(rs)rs.addEventListener('click',()=>{const e=embeddedState();if(!e)return;if(!confirm('Discard your local changes and go back to the last version saved into the page?'))return;pushHistory();state=e;sel=null;changed();closeDlg();fitView();});}
function stripForShare(s){const c=clone(s);if(c.underlay){c.underlay=Object.assign({},c.underlay,{src:null});if(!c.underlay.src)c.underlay=null;}return c;}
function shareBase(){try{if(document.referrer&&/^https?:\/\//.test(document.referrer)&&window.self!==window.top)return document.referrer;}catch(e){}return location.href;}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){try{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e2){return false;}}}
async function saveToPage(){if(!caps.artifact)return;const btn=$('#save-page');if(btn){btn.disabled=true;btn.textContent='Saving…';}
 const s=clone(state);s.savedAt=new Date().toISOString();
 try{sessionStorage.setItem('willitfit:justsaved','1');}catch(e){}
 try{localStorage.removeItem(KEY);}catch(e){}
 try{await caps.artifact.publish(pageHTML(s));state.savedAt=s.savedAt;toast('Saved — reloading');}
 catch(e){const code=e&&e.code;try{sessionStorage.removeItem('willitfit:justsaved');}catch(x){}scheduleSave();
  if(code==='not_writer'||code==='not_granted'||code==='consent_required'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'){readOnly=true;toast('This view is read-only — use a board code to share instead');closeDlg();}
  else if(code==='conflict'){toast('Someone else saved first — loading their version');}
  else if(code==='too_large'){toast('Too large to save — try a smaller floor-plan image');if(btn){btn.disabled=false;btn.textContent='Save to page';}}
  else if(code==='rate_limited'){toast('Saving too often — wait a moment');if(btn){btn.disabled=false;btn.textContent='Save to page';}}
  else{toast('Could not save ('+(code||'error')+')');if(btn){btn.disabled=false;btn.textContent='Save to page';}}}}
async function exportPNG(){try{const b=planBounds();const pad=40;const W=b.w+pad*2,H=b.d+pad*2;const scale=Math.min(4,Math.max(1,2400/Math.max(W,H)));
 const savedSel=sel,savedMode=mode;sel=null;mode='furnish';render();
 const css=getComputedStyle(document.documentElement);const vars=['--ink','--muted','--wall','--floor','--floor-oak','--floor-tile','--floor-dark','--accent','--warn','--canvas','--panel','--grid','--grid-major','--sans','--disp','--mono'].map(v=>v+':'+css.getPropertyValue(v)+';').join('');
 const style='<style>:root{'+vars+'}'+$('#css').textContent.split('/* canvas */')[1].split('.toast')[0]+'</style>';
 const inner=world.innerHTML;sel=savedSel;mode=savedMode;render();
 const svgStr='<svg xmlns="http://www.w3.org/2000/svg" width="'+(W*scale)+'" height="'+(H*scale)+'" viewBox="'+(b.x-pad)+' '+(b.y-pad)+' '+W+' '+H+'">'+style+'<rect x="'+(b.x-pad)+'" y="'+(b.y-pad)+'" width="'+W+'" height="'+H+'" fill="'+css.getPropertyValue('--canvas')+'"/>'+inner+'</svg>';
 const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
 const c=document.createElement('canvas');c.width=W*scale;c.height=H*scale;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);
 const png=await new Promise(r=>c.toBlob(r,'image/png'));await caps.downloads.save({filename:(state.title||'board').replace(/[^\w\- ]+/g,'').trim()+'.png',data:png});toast('Saved');}
 catch(e){if(!(e&&e.code==='declined'))toast('Could not make the picture');}}

/* ---------- boot ---------- */
async function boot(){shell();state=await loadInitial();
 if(!state.units)state.units='m';if(!state.grid)state.grid=5;if(!state.wall)state.wall=12;if(state.snap==null)state.snap=true;
 computeIssues();renderPanels();fitView();
 try{if(sessionStorage.getItem('willitfit:justsaved')){sessionStorage.removeItem('willitfit:justsaved');toast('Saved into the page');}}catch(e){}
 if(fromLink)toast('Loaded the layout from the link');else if(planUpdated)toast('The floor plan was updated — starting from the new plan');
 if(window.claude&&typeof window.claude.use==='function'){try{caps.artifact=await window.claude.use('artifact');}catch(e){}try{caps.downloads=await window.claude.use('downloads');}catch(e){}}
 $('#board').addEventListener('pointerdown',()=>{if(window.innerWidth<=920)closeDrawers();},true);}
boot();
window.willitfit={pageHTML:()=>pageHTML(Object.assign(clone(state),{savedAt:new Date().toISOString()})),state:()=>state};
})();
</script>
