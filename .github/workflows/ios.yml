name: iOS TestFlight

# Builds the Will It Fit iPhone app on GitHub's free macOS runners and uploads
# it to TestFlight — no Mac needed, ever. Signing is fully automatic via an
# App Store Connect API key.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     – App Store Connect API key ID        (e.g. 2X9R4HXF34)
#   ASC_ISSUER_ID  – App Store Connect issuer ID          (a UUID)
#   ASC_KEY_P8     – full contents of the AuthKey_….p8 file
#   APPLE_TEAM_ID  – the Apple Developer team ID          (e.g. ABCDE12345)
# Until they exist, the build job skips itself with a notice.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios-app/**', '.github/workflows/ios.yml']

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          K: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -n "$K" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets not configured yet - build skipped. Add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID in Settings > Secrets and variables > Actions, then re-run."
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.ok == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -n1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"


      # Apple caps Apple Development certificates at 10. Automatic signing makes a
      # NEW one on every clean runner and bins the private key with the runner, so
      # CI ate all ten by build 11 and the next archive died on "Choose a
      # certificate to revoke". None of them is reusable - nothing holds their keys
      # - so prune the leftovers before archiving. Keeps the two newest, so a build
      # running concurrently doesn't have its certificate pulled out from under it,
      # and only acts once there are 6, to avoid churning the account every run.
      - name: Prune stale development certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/prune.js" <<'JS'
          const fs = require('fs'), crypto = require('crypto');
          const b64u = b => Buffer.from(b).toString('base64').replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
          const now = Math.floor(Date.now() / 1000);
          const h = b64u(JSON.stringify({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' }));
          const p = b64u(JSON.stringify({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 900, aud: 'appstoreconnect-v1' }));
          const sig = crypto.sign('sha256', Buffer.from(h + '.' + p), {
            key: fs.readFileSync(process.env.RUNNER_TEMP + '/AuthKey.p8', 'utf8'),
            dsaEncoding: 'ieee-p1363' });
          const jwt = h + '.' + p + '.' + b64u(sig);
          const api = (m, path) => fetch('https://api.appstoreconnect.apple.com' + path,
            { method: m, headers: { Authorization: 'Bearer ' + jwt } });
          (async () => {
            const r = await api('GET', '/v1/certificates?limit=200');
            if (!r.ok) { console.log('::warning::could not list certificates (' + r.status + ') - skipping prune'); return; }
            const d = (await r.json()).data.filter(c => c.attributes.certificateType === 'DEVELOPMENT');
            d.sort((a, b) => new Date(b.attributes.expirationDate) - new Date(a.attributes.expirationDate));
            console.log('development certificates in use: ' + d.length + ' of 10');
            if (d.length < 6) { console.log('below the watermark - nothing to prune'); return; }
            for (const c of d.slice(2)) {
              const x = await api('DELETE', '/v1/certificates/' + c.id);
              console.log('revoke ' + c.id + ' ' + (x.status === 204 ? 'ok' : 'FAILED ' + x.status));
            }
          })();
          JS
          node "$RUNNER_TEMP/prune.js"
      - name: Archive (build number = run number)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios-app/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E 'error|warning: .*(signing|provisioning)|Signing|Archive|BUILD' || true
          test -d "$RUNNER_TEMP/App.xcarchive"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios-app/exportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 14
